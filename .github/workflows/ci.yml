name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f requirements.txt
          test -f pyproject.toml
          test -f main.py
          test -f run_server.py
          test -f .env.example
          test -f .cursor/environment.json
          test -f .github/workflows/ci.yml
          test -f frontend/package.json
      - name: Check for committed secret material
        run: |
          # Skip docs/yaml/example env and Python sources (api_key= params are not secrets).
          ! grep -RInE '(api[_-]?key|secret|token|password)\s*[:=]\s*["'\'']?[A-Za-z0-9_\-]{20,}' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude-dir=venv \
            --exclude='*.md' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            --exclude='*.py' \
            --exclude='.env.example' \
            --exclude='.secrets.baseline' \
            .

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements.txt
      - name: Test
        run: pytest
