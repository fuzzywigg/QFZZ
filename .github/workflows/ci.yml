name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || echo "No standard install method found"
      - name: Lint
        run: |
          pip install ruff
          ruff check . || true
      - name: Test
        run: |
          pip install pytest
          pytest || echo "No tests found"
