name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false  # Continue testing other versions if one fails
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Create test .env file
        run: |
          # Create minimal .env for tests (no real keys needed - tests are mocked)
          cat > .env << EOF
          GOOGLE_AI_API_KEY=test_key_will_be_mocked
          GROQ_API_KEY=test_key_will_be_mocked
          ANTHROPIC_API_KEY=test_key_will_be_mocked
          OPENAI_API_KEY=test_key_will_be_mocked
          OLLAMA_BASE_URL=http://localhost:11434
          EOF
      
      - name: Run tests with pytest
        run: |
          pytest -v --cov=qfzz --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy
      
      - name: Run ruff
        run: ruff check qfzz/ tests/
      
      - name: Run black (check only)
        run: black --check qfzz/ tests/
      
      - name: Run isort (check only)
        run: isort --check-only qfzz/ tests/
      
      - name: Run mypy
        run: mypy qfzz/ --ignore-missing-imports
        continue-on-error: true  # Don't fail CI on type errors yet

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit detect-secrets
      
      - name: Run safety (dependency vulnerability check)
        run: safety check --json || true
        continue-on-error: true
      
      - name: Run bandit (security linter)
        run: bandit -r qfzz/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Run detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
