events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=stream:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream servers
    upstream qfzz_api {
        server qfzz-app:8001;
    }

    upstream qfzz_stream {
        server icecast:8000;
    }

    upstream qfzz_frontend {
        server frontend:3000;
    }

    # Main site - pappas.work / www.pappas.work
    server {
        listen 80;
        server_name pappas.work www.pappas.work;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name pappas.work www.pappas.work;

        ssl_certificate /etc/letsencrypt/live/pappas.work/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pappas.work/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        # Static files
        location / {
            limit_req zone=general burst=50 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # API - api.pappas.work
    server {
        listen 80;
        server_name api.pappas.work;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.pappas.work;

        ssl_certificate /etc/letsencrypt/live/pappas.work/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pappas.work/privkey.pem;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';

        location / {
            limit_req zone=api burst=20 nodelay;
            
            # Handle OPTIONS for CORS
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
            proxy_pass http://qfzz_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Stream - stream.pappas.work
    server {
        listen 80;
        server_name stream.pappas.work;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name stream.pappas.work;

        ssl_certificate /etc/letsencrypt/live/pappas.work/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pappas.work/privkey.pem;

        # CORS for audio streaming
        add_header Access-Control-Allow-Origin *;

        location / {
            limit_req zone=stream burst=10 nodelay;
            
            proxy_pass http://qfzz_stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Streaming optimizations
            proxy_buffering off;
            proxy_cache off;
            tcp_nopush on;
            tcp_nodelay on;
        }
    }

    # Web App - app.pappas.work
    server {
        listen 80;
        server_name app.pappas.work;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name app.pappas.work;

        ssl_certificate /etc/letsencrypt/live/pappas.work/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pappas.work/privkey.pem;

        location / {
            limit_req zone=general burst=50 nodelay;
            
            proxy_pass http://qfzz_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
