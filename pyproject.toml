[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qfzz"
version = "0.1.0"
description = "QFZZ: AI Radio for the Individual - Agentic radio station with quantum security"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "fuzzywigg"}
]
keywords = ["ai", "radio", "blockchain", "edge-computing", "personalized-dj"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/fuzzywigg/QFZZ"
Documentation = "https://qfzz-radio.web.app"
Repository = "https://github.com/fuzzywigg/QFZZ"
Issues = "https://github.com/fuzzywigg/QFZZ/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
