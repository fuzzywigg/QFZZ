[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qfzz-radio"
version = "0.1.0"
description = "AI-powered quantum radio station"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "QFZZ Team"}
]
keywords = ["ai", "radio", "llm", "music", "dj", "streaming", "quantum", "qdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "google-generativeai>=0.8.6",
    "anthropic>=0.8.0",
    "openai>=1.0.0",
    "requests>=2.33.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "filelock>=3.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
quantum = [
    "qsharp>=1.9.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=26.3.1",
    "isort>=5.12.0",
    "detect-secrets>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/fuzzywigg/QFZZ"
Repository = "https://github.com/fuzzywigg/QFZZ"

[project.scripts]
qfzz = "qfzz.main:run"

[tool.setuptools.packages.find]
include = ["qfzz*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qfzz --cov-report=html --cov-report=term"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
